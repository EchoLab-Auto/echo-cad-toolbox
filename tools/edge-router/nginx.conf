# =============================================================================
# edge-router —— 按「域名前缀」分流到本机不同端口
#
# 场景：同一个公网 IP（114.132.241.46）上跑了很多服务，用端口号区分太难记，
#       于是改成用子域名：
#           http://cad.某个域名/    → 127.0.0.1:2228  (echo-cad-toolbox)
#           http://panel.某个域名/  → 127.0.0.1:8080  (EchoAgent panel)
#
# 关键点：只看 Host 的**第一段**，所以 base domain 随便换都生效——
#   cad.echo-tech.com、cad.example.cn、cad.114.132.241.46.nip.io 都路由到同一个端口。
#   新增/删除路由不用改这个文件，用 `edge-route add|rm` 即可（见 README）。
#
# 拓扑：
#   公网 :80 ──▶ 本容器(host 网络) ──▶ 127.0.0.1:<该前缀对应端口>
# 用 host 网络是为了能直接够到所有宿主机端口（docker 发布的、以及裸进程的）。
# =============================================================================

worker_processes auto;
# 日志直接写 stdout/stderr，`docker logs edge-router` 就能看
error_log /dev/stderr warn;
pid /tmp/nginx-edge.pid;

events { worker_connections 1024; }

http {
    server_tokens off;

    log_format edge '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'host=$host prefix=$edge_prefix -> :$edge_backend rt=$request_time';
    access_log /dev/stdout edge;

    client_max_body_size 32m;
    client_body_buffer_size 256k;

    # ---- 取 Host 的第一段作为前缀 -------------------------------------------
    #   cad.example.com     -> cad
    #   Panel.Example.com   -> panel   （$host 已被 nginx 转小写）
    #   114.132.241.46      -> 114     （没有前缀，必然匹配不到，落到 421）
    #   localhost           -> ""      （同上）
    map $host $edge_prefix {
        default                                                     "";
        "~^(?<pfx>[a-z0-9][a-z0-9_-]*)\.(?<edge_rest>.+)$"          $pfx;
    }

    # ---- 前缀 → 端口 的路由表（由 edge-route 生成，勿手改）-------------------
    include /etc/nginx/edge/routes.conf;

    # ---- 所有后端共用的转发参数 ---------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    # WebSocket / SSE：以后挂需要长连接的玩意也不用改配置
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_buffering    off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_ignore_client_abort on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # ---- HTTP 入口 ---------------------------------------------------------
    # 80：给「已备案域名」或直接 IP 访问用（未备案域名会被腾讯云劫持到
    #     dnspod webblock，与本服务无关，实测见 /etc/esc/edge/README.md）
    # 2229：安全组已放行，且非 80/443 端口不受备案拦截 —— 主力入口
    server {
        listen 80 default_server;
        listen 2229 default_server;
        server_name _;

        # 未知前缀：返回 421 + JSON 提示，而不是 404
        # 用 421（Misdirected Request）是为了不与后端自己的 404 混淆
        error_page 421 = @edge_unmapped;

        location / {
            if ($edge_backend = "") { return 421; }
            proxy_pass http://127.0.0.1:$edge_backend;
        }

        location @edge_unmapped {
            default_type application/json;
            return 421 '{"error":"no_route","message":"该域名前缀没有配置路由。用 edge-route list 查看，或 edge-route add <prefix> <port> 添加。","host":"$host","prefix":"$edge_prefix"}';
        }
    }

    # ---- 可选：HTTPS --------------------------------------------------------
    # 拿到证书后把 /etc/esc/edge/tls.conf 填上并 `edge-route reload`。
    # 空文件是合法的 include，所以没有证书时这段什么都不做。
    include /etc/nginx/edge/tls.conf;
}
