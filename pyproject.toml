[project]
name = "echo-cad-toolbox"
version = "1.0.0"
description = "Interactive cycloidal (pin-wheel) profile generator, simulator and DXF exporter"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
