services:
  cad-toolbox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 国内网络：PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        # 拉不到官方 python 镜像时可用加速源，例如
        # PYTHON_IMAGE=docker.m.daocloud.io/library/python:3.12-slim
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
        # Debian 软件源镜像（国内建议 mirrors.cloud.tencent.com）
        APT_MIRROR: ${APT_MIRROR:-}
    image: echo-cad-toolbox:1.2.0
    container_name: echo-cad-toolbox
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
    volumes:
      # 晶格化作业的产物（STL/GLB 预览缓存），不挂也不影响功能
      - lattice-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 晶格化（体素化 + marching cubes）是内存/CPU 密集型：
    # 256 分辨率约需 0.8~1.2 GB 峰值内存，按下限给足 2 GB；
    # 边缘设备可降到 128 分辨率并把 memory 调回 768M。
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G

volumes:
  lattice-data:
